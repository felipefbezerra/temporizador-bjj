<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1d1f">
<meta name="description" content="Temporizador de rondas, tabata e cronômetro para treinos e lutas de jiu-jitsu.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BJJ Timer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Temporizador BJJ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma tela, lista de intervalos estilo cronômetro de academia, tela de luta em cor cheia por fase */
:root{
  color-scheme:dark;
  --bg:#1c1d1f;
  --panel:#262729;
  --band:#303133;
  --line:#3a3b3e;
  --fg:#f4f4f2;
  --muted:#8d8e91;
  --accent:#9cf04a;
  --prep:#f3ea3a;
  --work:#8ef04a;
  --rest:#ee3a2c;
  --round:#3fa9ec;
  --cycle:#f3ea3a;
  --relax:#3fa9ec;
  --display:"Oswald","Arial Narrow","Roboto Condensed",Impact,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);text-transform:uppercase;font-size:1.45rem;font-weight:500;letter-spacing:.01em}
.top .cancel{justify-self:start;color:var(--muted)}
.top .save{justify-self:end;color:var(--accent)}
.top .save:disabled,.top .cancel:disabled{opacity:.35;cursor:default}
.scroll{flex:1;overflow-y:auto;min-height:0}
.band{background:var(--band);text-align:center;color:var(--muted);text-transform:uppercase;font-size:1.4rem;padding:14px 0;margin-top:14px;letter-spacing:.02em}
.presets{display:flex;gap:8px;overflow-x:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 10px;text-transform:uppercase;font-size:.85rem;letter-spacing:.04em;color:var(--fg);background:var(--panel)}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip.on{border-color:var(--accent);color:var(--accent)}
.list{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.row{width:100%;display:grid;grid-template-columns:22px 1fr auto 20px;align-items:center;column-gap:12px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.dot{width:22px;height:22px;border-radius:50%;align-self:start;margin-top:5px}
.row .name{font-size:1.45rem;font-weight:500;text-transform:uppercase;line-height:1.2}
.row .desc{font-size:.92rem;color:var(--muted);text-transform:uppercase;line-height:1.3;margin-top:4px}
.row .val{font-size:2.9rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.row .chev{color:var(--muted);font-size:1.6rem;font-weight:400}
.total{display:flex;justify-content:space-between;padding:16px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));color:var(--muted);text-transform:uppercase;font-size:1rem;letter-spacing:.04em}
.total b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.start{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)));background:var(--band);border-radius:16px;padding:18px;font-size:1.5rem;text-transform:uppercase;font-weight:500}
.start svg{width:30px;height:30px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:24px;text-transform:uppercase;font-size:.78rem;letter-spacing:.03em}
.tab svg{width:30px;height:30px}
.tab[aria-selected="true"]{background:var(--band)}

/* Folha de edição */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet h2{margin:0;font-size:1.5rem;font-weight:500;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sheet h2 .dot{margin:0;width:16px;height:16px}
.fields{display:flex;justify-content:center;gap:18px;align-items:flex-end}
.field{display:flex;flex-direction:column;align-items:center;gap:8px}
.field label{color:var(--muted);text-transform:uppercase;font-size:.85rem;letter-spacing:.06em}
.field input{width:3.1ch;font:inherit;font-size:3.6rem;font-weight:500;text-align:center;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:4px 6px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.field input::-webkit-inner-spin-button,.field input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.field.wide input{width:4ch}
.colon{font-size:3.4rem;padding-bottom:62px;color:var(--muted)}
.step{display:flex;gap:8px}
.step button{width:52px;height:44px;border-radius:12px;background:var(--band);font-size:1.4rem}
.sheet .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions button{padding:14px;border-radius:12px;background:var(--band);text-transform:uppercase;font-size:1.15rem}
.sheet .actions .ok{background:var(--accent);color:#16200c;font-weight:600}
.hint{color:var(--muted);font-size:.85rem;text-transform:uppercase;text-align:center;margin:-6px 0 0;letter-spacing:.03em}

/* Tela de luta */
.run{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--phase,var(--prep));color:#111;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background-color .25s}
.run.dark-text{color:#121212}
.run.light-text{color:#fff}
.run-head{display:flex;justify-content:space-between;align-items:center;padding-top:14px;text-transform:uppercase;font-size:1.05rem;letter-spacing:.05em;font-weight:500}
.run-head button{border:2px solid currentColor;border-radius:999px;padding:4px 14px;font-size:.95rem}
.run-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;cursor:pointer;user-select:none}
.phase-name{font-size:clamp(2.2rem,9vw,4rem);font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.clock{font-size:clamp(7rem,38vw,17rem);font-weight:600;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:.08em 0}
.counters{display:flex;gap:28px;justify-content:center;text-transform:uppercase;font-size:1.05rem;letter-spacing:.05em;font-weight:500}
.counters b{display:block;font-size:2.2rem;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;line-height:1.1}
.paused-tag{margin-top:14px;font-size:1.2rem;text-transform:uppercase;letter-spacing:.12em;border:2px solid currentColor;padding:2px 14px;border-radius:6px}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.18);overflow:hidden}
.light-text .bar{background:rgba(255,255,255,.25)}
.bar i{display:block;height:100%;background:currentColor;width:0}
.run-foot{display:flex;flex-direction:column;gap:12px;padding:12px 0 18px}
.next{display:flex;justify-content:space-between;text-transform:uppercase;font-size:1rem;letter-spacing:.04em;font-weight:500;font-variant-numeric:tabular-nums}
.ctrls{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px}
.ctrls button{padding:16px 0;border-radius:14px;background:rgba(0,0,0,.16);text-transform:uppercase;font-size:1.1rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.light-text .ctrls button{background:rgba(255,255,255,.2)}
.ctrls .main{background:rgba(0,0,0,.82);color:#fff;font-size:1.3rem}
.light-text .ctrls .main{background:#fff;color:#111}
.ctrls svg{width:22px;height:22px}

/* Cronômetro */
.sw{display:flex;flex-direction:column;align-items:center;padding:28px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:22px}
.sw-clock{font-size:clamp(4.4rem,22vw,8rem);font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.sw-clock small{font-size:.45em;color:var(--muted)}
.sw-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.sw-btns button{padding:18px;border-radius:16px;background:var(--band);text-transform:uppercase;font-size:1.3rem;font-weight:500}
.sw-btns .go{background:var(--accent);color:#16200c}
.sw-btns .go.stop{background:var(--rest);color:#fff}
.laps{width:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lap{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:1.2rem;font-variant-numeric:tabular-nums;text-transform:uppercase}
.lap span:first-child{color:var(--muted)}
.empty{color:var(--muted);text-align:center;text-transform:uppercase;font-size:.95rem;letter-spacing:.04em;padding:10px 0}
@media (prefers-reduced-motion:reduce){.run{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <button class="cancel" id="btn-cancel" type="button">Cancelar</button>
    <div id="mode-title">Rondas</div>
    <button class="save" id="btn-save" type="button">Guardar</button>
  </header>

  <main class="scroll" id="view-timer">
    <div class="presets" id="presets" aria-label="Predefinições"></div>
    <div class="band">Intervalos</div>
    <div class="list" id="list"></div>
    <div class="total"><span>Duração total</span><b id="total">--</b></div>
    <button class="start" id="btn-start" type="button">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="18" r="11" fill="currentColor"/><rect x="13.5" y="2.5" width="5" height="3" rx="1" fill="currentColor"/><path d="M14 13.5v9l7-4.5z" fill="var(--band)"/></svg>
      Iniciar
    </button>
  </main>

  <main class="scroll" id="view-sw" hidden>
    <div class="sw">
      <div class="sw-clock" id="sw-clock">00:00<small>.0</small></div>
      <div class="sw-btns">
        <button type="button" id="sw-lap">Zerar</button>
        <button type="button" class="go" id="sw-go">Iniciar</button>
      </div>
    </div>
    <div class="laps" id="laps"></div>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="tabata" type="button">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="16" cy="18" r="11"/><path d="M13 3h6M16 3v4M16 13v6M25 7l2 2"/></svg>Tabata</button>
    <button class="tab" role="tab" data-tab="rondas" type="button">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="12"/><path d="M16 16l-6-6"/></svg>Rondas</button>
    <button class="tab" role="tab" data-tab="sw" type="button">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="12"/><circle cx="16" cy="16" r="1.6" fill="currentColor"/></svg>Cronômetro</button>
  </nav>
</div>

<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"><span class="dot" id="sheet-dot"></span><span id="sheet-name"></span></h2>
    <div class="fields" id="fields-time">
      <div class="field"><label for="in-min">Min</label><input id="in-min" type="number" inputmode="numeric" min="0" max="99"><div class="step"><button type="button" data-step="min:-1" aria-label="Menos um minuto">−</button><button type="button" data-step="min:1" aria-label="Mais um minuto">+</button></div></div>
      <div class="colon">:</div>
      <div class="field"><label for="in-sec">Seg</label><input id="in-sec" type="number" inputmode="numeric" min="0" max="59"><div class="step"><button type="button" data-step="sec:-5" aria-label="Menos cinco segundos">−</button><button type="button" data-step="sec:5" aria-label="Mais cinco segundos">+</button></div></div>
    </div>
    <div class="fields" id="fields-count" hidden>
      <div class="field wide"><label for="in-count">Quantidade</label><input id="in-count" type="number" inputmode="numeric" min="1" max="99"><div class="step"><button type="button" data-step="count:-1" aria-label="Menos um">−</button><button type="button" data-step="count:1" aria-label="Mais um">+</button></div></div>
    </div>
    <p class="hint" id="sheet-hint"></p>
    <div class="actions"><button type="button" id="sheet-cancel">Cancelar</button><button type="button" class="ok" id="sheet-ok">OK</button></div>
  </div>
</div>

<section class="run" id="run" hidden>
  <div class="run-head"><span id="run-mode">Rondas</span><button type="button" id="run-stop">Encerrar</button></div>
  <div class="run-main" id="run-main" title="Toque para pausar">
    <div class="phase-name" id="run-phase">Preparar</div>
    <div class="clock" id="run-clock">0:30</div>
    <div class="counters" id="run-counters"></div>
    <div class="paused-tag" id="run-paused" hidden>Pausado</div>
  </div>
  <div class="run-foot">
    <div class="bar"><i id="run-bar"></i></div>
    <div class="next"><span id="run-next">A seguir: Exercício</span><span id="run-left">Restante 0:00</span></div>
    <div class="ctrls">
      <button type="button" id="run-prev" aria-label="Intervalo anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button type="button" class="main" id="run-toggle">Pausar</button>
      <button type="button" id="run-skip" aria-label="Próximo intervalo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </div>
</section>

<script>
(function(){
  const PHASE = {
    prep:  {name:'Preparar',  color:'var(--prep)',  text:'dark'},
    work:  {name:'Exercício', color:'var(--work)',  text:'dark'},
    rest:  {name:'Descansar', color:'var(--rest)',  text:'light'},
    cycle: {name:'Descanso entre ciclos', color:'var(--cycle)', text:'dark'},
    relax: {name:'Relaxe',    color:'var(--relax)', text:'dark'}
  };

  const DEFAULTS = {
    rondas: {prep:30, work:300, rest:90, rounds:99, relax:120},
    tabata: {prep:45, work:30, rest:5, rounds:12, cycles:4, cycleRest:90, relax:120}
  };

  // Predefinições de BJJ. Tempos de luta seguem a tabela IBJJF para adultos.
  const PRESETS = {
    rondas: [
      {label:'Treino 5 min + 1:30', color:'var(--work)', v:{prep:30, work:300, rest:90, rounds:99, relax:120}},
      {label:'Luta branca 5 min',  color:'#f4f4f2', v:{prep:10, work:300, rest:0, rounds:1, relax:0}},
      {label:'Luta azul 6 min',    color:'#2f6fe0', v:{prep:10, work:360, rest:0, rounds:1, relax:0}},
      {label:'Luta roxa 7 min',    color:'#7b3fc4', v:{prep:10, work:420, rest:0, rounds:1, relax:0}},
      {label:'Luta marrom 8 min',  color:'#7a4a24', v:{prep:10, work:480, rest:0, rounds:1, relax:0}},
      {label:'Luta preta 10 min',  color:'#0c0c0c', v:{prep:10, work:600, rest:0, rounds:1, relax:0}},
      {label:'Rola 6×6 min',       color:'var(--round)', v:{prep:30, work:360, rest:60, rounds:6, relax:120}}
    ],
    tabata: [
      {label:'Padrão 12×4',  color:'var(--work)', v:{prep:45, work:30, rest:5, rounds:12, cycles:4, cycleRest:90, relax:120}},
      {label:'Tabata clássico 20/10', color:'var(--prep)', v:{prep:10, work:20, rest:10, rounds:8, cycles:1, cycleRest:60, relax:60}},
      {label:'Drill de passagem', color:'var(--round)', v:{prep:15, work:60, rest:15, rounds:6, cycles:3, cycleRest:120, relax:120}}
    ]
  };

  const FIELDS = {
    rondas: [
      {k:'prep', name:'Preparar', desc:'Contagem decrescente antes de começar', color:'var(--prep)', type:'time'},
      {k:'work', name:'Exercício', desc:'Fazer exercícios durante este tempo', color:'var(--work)', type:'time', min:1},
      {k:'rest', name:'Descansar', desc:'Descansar durante este tempo', color:'var(--rest)', type:'time'},
      {k:'rounds', name:'Rondas', desc:'Uma ronda é trabalho + descanso', color:'var(--round)', type:'count'},
      {k:'relax', name:'Relaxe', desc:'Relaxe após o treino', color:'var(--relax)', type:'time'}
    ],
    tabata: [
      {k:'prep', name:'Preparar', desc:'Contagem decrescente antes de começar', color:'var(--prep)', type:'time'},
      {k:'work', name:'Exercício', desc:'Fazer exercícios durante este tempo', color:'var(--work)', type:'time', min:1},
      {k:'rest', name:'Descansar', desc:'Descansar durante este tempo', color:'var(--rest)', type:'time'},
      {k:'rounds', name:'Rondas', desc:'Uma ronda é trabalho + descanso', color:'var(--round)', type:'count'},
      {k:'cycles', name:'Ciclos', desc:c=>'Um ciclo são '+c.rounds+(c.rounds==1?' ronda':' rondas'), color:'var(--cycle)', type:'count'},
      {k:'cycleRest', name:'Descanso entre ciclos', desc:'Intervalo de recuperação', color:'var(--cycle)', type:'time'},
      {k:'relax', name:'Relaxe', desc:'Relaxe após o treino', color:'var(--relax)', type:'time'}
    ]
  };

  const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  const saved = {
    rondas: Object.assign({}, DEFAULTS.rondas, store.get('bjj.rondas') || {}),
    tabata: Object.assign({}, DEFAULTS.tabata, store.get('bjj.tabata') || {})
  };
  const draft = {rondas:{...saved.rondas}, tabata:{...saved.tabata}};
  let tab = store.get('bjj.tab') || 'rondas';
  if(!['rondas','tabata','sw'].includes(tab)) tab = 'rondas';

  const $ = id => document.getElementById(id);

  function fmt(s, colonShort){
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    if(h) return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    if(colonShort && m===0) return ':'+String(sec).padStart(2,'0');
    return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
  }
  function fmtClock(s){
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    if(h) return h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    return m+':'+String(sec).padStart(2,'0');
  }
  function fmtTotal(s){
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    if(h) return h+' h '+String(m).padStart(2,'0')+' min';
    return m+' min'+(sec? ' '+String(sec).padStart(2,'0')+' s':'');
  }

  function buildSequence(mode, c){
    const seq = [];
    const push = (type, dur, extra) => { if(dur>0) seq.push(Object.assign({type, dur}, extra)); };
    push('prep', c.prep, {});
    const cycles = mode==='tabata' ? c.cycles : 1;
    for(let cy=1; cy<=cycles; cy++){
      for(let r=1; r<=c.rounds; r++){
        push('work', c.work, {round:r, cycle:cy});
        if(r<c.rounds) push('rest', c.rest, {round:r, cycle:cy});
      }
      if(mode==='tabata' && cy<cycles) push('cycle', c.cycleRest, {round:c.rounds, cycle:cy});
    }
    push('relax', c.relax, {});
    return seq;
  }

  /* ---------- Configuração ---------- */
  function render(){
    document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===tab)));
    const isSw = tab==='sw';
    $('view-timer').hidden = isSw;
    $('view-sw').hidden = !isSw;
    $('mode-title').textContent = isSw ? 'Cronômetro' : (tab==='tabata' ? 'Tabata' : 'Rondas');
    $('btn-cancel').style.visibility = isSw ? 'hidden' : 'visible';
    $('btn-save').style.visibility = isSw ? 'hidden' : 'visible';
    if(isSw) return;

    const c = draft[tab];
    const dirty = JSON.stringify(c) !== JSON.stringify(saved[tab]);
    $('btn-save').disabled = !dirty;
    $('btn-cancel').disabled = !dirty;

    $('list').innerHTML = FIELDS[tab].map(f=>{
      const desc = typeof f.desc==='function' ? f.desc(c) : f.desc;
      const val = f.type==='time' ? fmt(c[f.k], true) : c[f.k];
      return `<button class="row" type="button" data-k="${f.k}">
        <span class="dot" style="background:${f.color}"></span>
        <span><div class="name">${f.name}</div><div class="desc">${desc}</div></span>
        <span class="val">${val}</span><span class="chev" aria-hidden="true">›</span></button>`;
    }).join('');

    $('presets').innerHTML = PRESETS[tab].map((p,i)=>{
      const on = Object.keys(p.v).every(k=>p.v[k]===c[k]);
      return `<button class="chip${on?' on':''}" type="button" data-p="${i}"><i style="background:${p.color};box-shadow:0 0 0 1px rgba(255,255,255,.25)"></i>${p.label}</button>`;
    }).join('');

    const total = buildSequence(tab, c).reduce((a,s)=>a+s.dur,0);
    $('total').textContent = fmtTotal(total);
  }

  document.querySelector('.tabs').addEventListener('click', e=>{
    const b = e.target.closest('.tab'); if(!b) return;
    tab = b.dataset.tab; store.set('bjj.tab', tab); render();
  });
  $('presets').addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    Object.assign(draft[tab], PRESETS[tab][+b.dataset.p].v); render();
  });
  $('btn-save').addEventListener('click', ()=>{
    saved[tab] = {...draft[tab]}; store.set('bjj.'+tab, saved[tab]); render();
  });
  $('btn-cancel').addEventListener('click', ()=>{
    draft[tab] = {...saved[tab]}; render();
  });

  /* ---------- Folha de edição ---------- */
  let editing = null;
  $('list').addEventListener('click', e=>{
    const b = e.target.closest('.row'); if(!b) return;
    editing = FIELDS[tab].find(f=>f.k===b.dataset.k);
    const v = draft[tab][editing.k];
    $('sheet-name').textContent = editing.name;
    $('sheet-dot').style.background = editing.color;
    const isTime = editing.type==='time';
    $('fields-time').hidden = !isTime;
    $('fields-count').hidden = isTime;
    if(isTime){ $('in-min').value = Math.floor(v/60); $('in-sec').value = v%60; }
    else $('in-count').value = v;
    $('sheet-hint').textContent = isTime ? (editing.min ? 'Mínimo 1 segundo' : 'Use 00:00 para pular este intervalo') : 'De 1 a 99';
    $('sheet').hidden = false;
    (isTime ? $('in-min') : $('in-count')).focus({preventScroll:true});
  });
  function closeSheet(){ $('sheet').hidden = true; editing = null; }
  $('sheet-cancel').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', e=>{ if(e.target===$('sheet')) closeSheet(); });
  document.addEventListener('keydown', e=>{
    if(!$('sheet').hidden){ if(e.key==='Escape') closeSheet(); if(e.key==='Enter') $('sheet-ok').click(); }
  });
  $('sheet').addEventListener('click', e=>{
    const b = e.target.closest('[data-step]'); if(!b) return;
    const [f, d] = b.dataset.step.split(':'); const delta = +d;
    if(f==='count'){ $('in-count').value = Math.min(99, Math.max(1, (+$('in-count').value||0)+delta)); return; }
    let total = (+$('in-min').value||0)*60 + (+$('in-sec').value||0) + (f==='min'? delta*60 : delta);
    total = Math.min(99*60+59, Math.max(0, total));
    $('in-min').value = Math.floor(total/60); $('in-sec').value = total%60;
  });
  $('sheet-ok').addEventListener('click', ()=>{
    if(!editing) return;
    let v;
    if(editing.type==='time'){
      v = Math.min(99, Math.max(0, Math.floor(+$('in-min').value||0)))*60 + Math.min(59, Math.max(0, Math.floor(+$('in-sec').value||0)));
      if(editing.min) v = Math.max(editing.min, v);
    } else v = Math.min(99, Math.max(1, Math.floor(+$('in-count').value||1)));
    draft[tab][editing.k] = v;
    closeSheet(); render();
  });

  /* ---------- Som ---------- */
  let ac = null;
  function audio(){
    if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(ac && ac.state==='suspended') ac.resume();
    return ac;
  }
  function beep(freq, dur, count, gap){
    const a = audio(); if(!a) return;
    for(let i=0;i<(count||1);i++){
      const t = a.currentTime + i*((dur||.15)+(gap||.12));
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||.15));
      o.connect(g).connect(a.destination); o.start(t); o.stop(t+(dur||.15)+0.02);
    }
  }
  const SOUND = {
    tick: ()=>beep(880, .12),
    work: ()=>beep(1320, .5),          // início de luta: apito longo agudo
    rest: ()=>beep(520, .25, 3, .1),   // fim de luta: três toques graves
    other:()=>beep(760, .35),
    done: ()=>beep(1040, .3, 4, .12)
  };

  /* ---------- Execução ---------- */
  let run = null, raf = 0, wakeLock = null;

  async function lockScreen(){
    try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
  function unlockScreen(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
  document.addEventListener('visibilitychange', ()=>{ if(run && !run.paused && document.visibilityState==='visible') lockScreen(); });

  function startRun(){
    const c = {...draft[tab]};
    const seq = buildSequence(tab, c);
    if(!seq.length) return;
    audio();
    run = {mode:tab, c, seq, i:0, paused:false, remaining:seq[0].dur, endAt:0, lastTick:null, finished:false};
    run.endAt = performance.now() + run.remaining*1000;
    $('run-mode').textContent = tab==='tabata' ? 'Tabata' : 'Rondas';
    $('run').hidden = false;
    lockScreen();
    enterPhase(false);
    loop();
  }
  function enterPhase(sound){
    const s = run.seq[run.i], p = PHASE[s.type];
    const el = $('run');
    el.style.setProperty('--phase', p.color);
    el.classList.toggle('light-text', p.text==='light');
    el.classList.toggle('dark-text', p.text!=='light');
    $('run-phase').textContent = p.name;
    run.lastTick = null;
    if(sound){ (s.type==='work' ? SOUND.work : s.type==='rest' || s.type==='cycle' ? SOUND.rest : SOUND.other)(); }
    renderCounters();
  }
  function renderCounters(){
    const s = run.seq[run.i];
    const parts = [];
    if(s.round){
      const r = run.c.rounds;
      parts.push(`<div>Ronda<b>${s.round}/${r}</b></div>`);
      if(run.mode==='tabata') parts.push(`<div>Ciclo<b>${s.cycle}/${run.c.cycles}</b></div>`);
    }
    $('run-counters').innerHTML = parts.join('');
    const nx = run.seq[run.i+1];
    $('run-next').textContent = nx ? 'A seguir: '+PHASE[nx.type].name+' '+fmtClock(nx.dur) : 'Último intervalo';
  }
  function loop(){
    cancelAnimationFrame(raf);
    const step = ()=>{
      if(!run) return;
      const now = performance.now();
      if(!run.paused && !run.finished){
        run.remaining = (run.endAt - now)/1000;
        const whole = Math.ceil(run.remaining);
        if(whole<=3 && whole>=1 && run.lastTick!==whole && run.seq[run.i].dur>3){ run.lastTick = whole; SOUND.tick(); }
        if(run.remaining<=0){
          if(run.i < run.seq.length-1){
            const over = -run.remaining;
            run.i++;
            run.remaining = run.seq[run.i].dur - over;
            run.endAt = now + run.remaining*1000;
            enterPhase(true);
          } else {
            finish();
          }
        }
      }
      draw();
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function draw(){
    const s = run.seq[run.i];
    const rem = run.finished ? 0 : run.remaining;
    $('run-clock').textContent = fmtClock(rem);
    $('run-bar').style.width = (100*(1 - Math.max(0,rem)/s.dur)).toFixed(2)+'%';
    let left = Math.max(0,rem);
    for(let j=run.i+1;j<run.seq.length;j++) left += run.seq[j].dur;
    $('run-left').textContent = 'Restante '+fmtClock(left);
    $('run-paused').hidden = !run.paused;
    $('run-toggle').textContent = run.finished ? 'Repetir' : run.paused ? 'Continuar' : 'Pausar';
  }
  function finish(){
    run.finished = true; run.remaining = 0;
    SOUND.done();
    $('run-phase').textContent = 'Treino concluído';
    $('run-next').textContent = 'Bom treino. Oss!';
    $('run').style.setProperty('--phase', 'var(--work)');
    $('run').classList.remove('light-text'); $('run').classList.add('dark-text');
    unlockScreen();
  }
  function togglePause(){
    if(!run) return;
    audio();
    if(run.finished){ stopRun(); startRun(); return; }
    run.paused = !run.paused;
    if(!run.paused){ run.endAt = performance.now() + run.remaining*1000; lockScreen(); }
  }
  function jump(dir){
    if(!run || run.finished) return;
    const s = run.seq[run.i];
    // "Anterior" reinicia o intervalo atual se já passaram mais de 2 s
    if(dir<0 && s.dur - run.remaining > 2){ /* mantém o índice */ }
    else {
      const ni = run.i + dir;
      if(ni<0) { /* já no início */ }
      else if(ni>=run.seq.length){ finish(); return; }
      else run.i = ni;
    }
    run.remaining = run.seq[run.i].dur;
    run.endAt = performance.now() + run.remaining*1000;
    enterPhase(!run.paused);
  }
  function stopRun(){
    cancelAnimationFrame(raf); run = null; $('run').hidden = true; unlockScreen();
  }

  $('btn-start').addEventListener('click', startRun);
  $('run-toggle').addEventListener('click', togglePause);
  $('run-main').addEventListener('click', togglePause);
  $('run-skip').addEventListener('click', ()=>jump(1));
  $('run-prev').addEventListener('click', ()=>jump(-1));
  $('run-stop').addEventListener('click', stopRun);
  document.addEventListener('keydown', e=>{
    if(!run) return;
    if(e.code==='Space'){ e.preventDefault(); togglePause(); }
    if(e.key==='ArrowRight') jump(1);
    if(e.key==='ArrowLeft') jump(-1);
    if(e.key==='Escape') stopRun();
  });

  /* ---------- Cronômetro ---------- */
  const sw = {running:false, start:0, acc:0, laps:[], raf:0};
  function swElapsed(){ return sw.acc + (sw.running ? performance.now()-sw.start : 0); }
  function swFmt(ms){
    const t = Math.floor(ms/100), d = t%10, s = Math.floor(t/10);
    return {main:fmt(s), dec:'.'+d};
  }
  function swDraw(){
    const f = swFmt(swElapsed());
    $('sw-clock').innerHTML = f.main+'<small>'+f.dec+'</small>';
    $('sw-go').textContent = sw.running ? 'Parar' : (sw.acc ? 'Continuar' : 'Iniciar');
    $('sw-go').classList.toggle('stop', sw.running);
    $('sw-lap').textContent = sw.running ? 'Volta' : 'Zerar';
    $('laps').innerHTML = sw.laps.length
      ? sw.laps.map((l,i)=>{ const f=swFmt(l.split), t=swFmt(l.total); return `<div class="lap"><span>Volta ${i+1}</span><span>${f.main}${f.dec}</span><span>${t.main}${t.dec}</span></div>`; }).reverse().join('')
      : '<div class="empty">Toque em Volta para marcar cada luta ou drill</div>';
  }
  function swLoop(){ swDraw(); if(sw.running) sw.raf = requestAnimationFrame(swLoop); }
  $('sw-go').addEventListener('click', ()=>{
    if(sw.running){ sw.acc += performance.now()-sw.start; sw.running=false; cancelAnimationFrame(sw.raf); swDraw(); }
    else { sw.start = performance.now(); sw.running=true; swLoop(); }
  });
  $('sw-lap').addEventListener('click', ()=>{
    if(sw.running){
      const total = swElapsed(); const prev = sw.laps.length ? sw.laps[sw.laps.length-1].total : 0;
      sw.laps.push({total, split:total-prev}); swDraw();
    } else { sw.acc=0; sw.laps=[]; swDraw(); }
  });

  render(); swDraw();
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
